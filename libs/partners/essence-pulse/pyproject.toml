[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-essence-pulse"
version = "0.1.0"
description = "Essence Pulse: permission-controlled AI interoperability layer prototype"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
essence-pulse-demo = "demo.run_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["essence_pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
